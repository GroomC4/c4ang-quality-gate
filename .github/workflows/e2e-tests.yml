name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/ci-*'  # CI 관련 feature 브랜치에서도 테스트
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev   # k3d 로컬 클러스터
          - prod  # EKS 프로덕션
      test_filter:
        description: 'Test filter (e.g., CustomerServiceTest, @happy-path)'
        required: false
        type: string
      service_versions:
        description: 'Service versions override (JSON: {"customer-service": "v1.2.0"})'
        required: false
        type: string

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.5'
  K3D_VERSION: 'v5.6.0'
  KUBECTL_VERSION: 'v1.29.0'
  HELM_VERSION: 'v3.14.0'

jobs:
  e2e-test:
    name: "E2E Tests (${{ inputs.environment || 'dev' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # OIDC 인증을 위한 권한 설정
    permissions:
      id-token: write   # AWS OIDC 인증에 필요
      contents: read    # 코드 체크아웃에 필요
      checks: write     # 테스트 결과 발행에 필요

    steps:
      # ===========================================
      # Setup
      # ===========================================
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Install k3d
        if: inputs.environment == 'dev' || inputs.environment == ''
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${{ env.K3D_VERSION }} bash

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      # ===========================================
      # dev Environment Setup (k3d)
      # ===========================================
      - name: Configure AWS credentials for ECR
        if: inputs.environment == 'dev' || inputs.environment == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          retry-max-attempts: 5  # OIDC 인증 재시도 횟수 증가

      - name: Setup K3d environment
        id: k3d-setup
        if: inputs.environment == 'dev' || inputs.environment == ''
        env:
          INFRA_REPO_PATH: ${{ github.workspace }}/c4ang-infra
          CLUSTER_NAME: e2e-test-cluster
          NAMESPACE: ecommerce
          # CI 환경에서도 Istio Gateway 사용 (운영과 동일한 환경)
          SKIP_ISTIO: 'false'
          # AWS 자격증명 전달 (ECR secret 생성에 필요)
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          chmod +x ./scripts/ci/setup-k3d-env.sh
          ./scripts/ci/setup-k3d-env.sh
          echo "kubeconfig=${{ github.workspace }}/.kubeconfig" >> $GITHUB_OUTPUT

      # ECR secret은 setup-k3d-env.sh 내부에서 생성됨 (Phase 5-1)

      - name: Wait for K3d services
        if: inputs.environment == 'dev' || inputs.environment == ''
        env:
          KUBECONFIG: ${{ steps.k3d-setup.outputs.kubeconfig }}
          NAMESPACE: ecommerce
          SKIP_ISTIO: 'false'
        run: |
          chmod +x ./scripts/ci/wait-for-services.sh
          ./scripts/ci/wait-for-services.sh --timeout 300

      # ===========================================
      # prod Environment Setup (EKS)
      # ===========================================
      - name: Configure AWS credentials for EKS
        if: inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Setup EKS environment
        id: eks-setup
        if: inputs.environment == 'prod'
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ap-northeast-2
          echo "kubeconfig=$HOME/.kube/config" >> $GITHUB_OUTPUT
          kubectl get nodes

      # ===========================================
      # Run Tests
      # ===========================================
      - name: Set environment variables
        id: env-vars
        run: |
          if [ "${{ inputs.environment }}" == "prod" ]; then
            echo "karate_env=prod" >> $GITHUB_OUTPUT
            echo "base_url=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
          else
            # CI 환경 (k3d) - Istio Gateway를 통해 접근 (운영과 동일)
            echo "karate_env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup port-forward (dev only)
        if: inputs.environment == 'dev' || inputs.environment == ''
        env:
          KUBECONFIG: ${{ steps.k3d-setup.outputs.kubeconfig }}
        run: |
          # Istio Ingress Gateway로 port-forward (운영과 동일한 방식)
          # Gateway가 JWT 검증 후 X-User-Id 헤더를 주입함
          echo "Setting up port-forward to Istio Ingress Gateway..."

          # Istio Gateway 상태 확인
          echo "Checking Istio Gateway status..."
          kubectl get gateway -n ecommerce || true
          kubectl get httproute -n ecommerce || true
          kubectl get svc -n istio-system | grep ingressgateway || true

          # Istio Ingress Gateway로 port-forward (8080 -> 80)
          kubectl port-forward svc/istio-ingressgateway 8080:80 -n istio-system &

          # 포트 준비 대기
          sleep 10

          # 포트 포워딩 확인
          echo "Checking port-forward status..."
          nc -z localhost 8080 && echo "Port 8080 (Istio Gateway) is ready" || echo "Port 8080 is not ready"

          # 서비스 상태 확인
          echo "Services status:"
          kubectl get svc -n ecommerce || true
          kubectl get pods -n istio-system || true

      - name: Run E2E tests
        env:
          KARATE_ENV: ${{ steps.env-vars.outputs.karate_env }}
          KUBECONFIG: ${{ steps.k3d-setup.outputs.kubeconfig || steps.eks-setup.outputs.kubeconfig }}
        run: |
          TEST_FILTER="${{ inputs.test_filter }}"
          if [ -n "$TEST_FILTER" ]; then
            ./gradlew test --tests "$TEST_FILTER" --info
          else
            ./gradlew test --info
          fi

      # ===========================================
      # Results & Cleanup
      # ===========================================
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "test-reports-${{ inputs.environment || 'dev' }}"
          path: |
            build/karate-reports/
            build/test-results/
            build/reports/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            build/test-results/**/*.xml
          check_name: "E2E Test Results (${{ inputs.environment || 'dev' }})"

      # ===========================================
      # Debug on Failure (클러스터 삭제 전에 실행)
      # ===========================================
      - name: Debug - Show pod status
        if: failure() && (inputs.environment == 'dev' || inputs.environment == '')
        env:
          KUBECONFIG: ${{ github.workspace }}/.kubeconfig
        run: |
          echo "=== K3d Cluster Status ==="
          k3d cluster list || true
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ecommerce -o wide || true
          echo ""
          echo "=== Istio Pods ==="
          kubectl get pods -n istio-system -o wide || true
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ecommerce || true
          echo ""
          echo "=== Gateway ==="
          kubectl get gateway -n ecommerce || true
          echo ""
          echo "=== HTTPRoute ==="
          kubectl get httproute -n ecommerce || true
          echo ""
          echo "=== Events (최근 오류) ==="
          kubectl get events -n ecommerce --sort-by='.lastTimestamp' | tail -30 || true

      - name: Debug - Show pod descriptions
        if: failure() && (inputs.environment == 'dev' || inputs.environment == '')
        env:
          KUBECONFIG: ${{ github.workspace }}/.kubeconfig
        run: |
          echo "=== Pod Descriptions ==="
          kubectl describe pods -n ecommerce || true

      - name: Debug - Show pod logs
        if: failure() && (inputs.environment == 'dev' || inputs.environment == '')
        env:
          KUBECONFIG: ${{ github.workspace }}/.kubeconfig
        run: |
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n ecommerce -o name 2>/dev/null); do
            echo "--- Logs for $pod ---"
            kubectl logs $pod -n ecommerce --tail=100 || true
            echo ""
            echo "--- Previous Logs for $pod (if crashed) ---"
            kubectl logs $pod -n ecommerce --previous --tail=100 2>/dev/null || echo "No previous logs"
            echo ""
          done

      - name: Debug - Show Docker Compose logs
        if: failure() && (inputs.environment == 'dev' || inputs.environment == '')
        run: |
          echo "=== Docker Compose Logs ==="
          cd c4ang-infra/external-services/docker
          docker compose logs --tail=100 || docker-compose logs --tail=100 || true

      # ===========================================
      # Cleanup (디버그 후 마지막에 실행)
      # ===========================================
      - name: Cleanup K3d environment
        if: always() && (inputs.environment == 'dev' || inputs.environment == '')
        env:
          INFRA_REPO_PATH: ${{ github.workspace }}/c4ang-infra
          CLUSTER_NAME: e2e-test-cluster
        run: |
          chmod +x ./scripts/ci/teardown-k3d-env.sh
          ./scripts/ci/teardown-k3d-env.sh
