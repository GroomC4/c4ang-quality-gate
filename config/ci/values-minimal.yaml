# CI 환경용 최소화 Helm values
# GitHub Actions Runner 리소스 제한에 맞춰 최적화
# 4 vCPU, 16GB RAM, 14GB Disk

# 리소스 최적화 (CI 환경)
resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 200m

# 단일 레플리카
replicaCount: 1

# HPA 비활성화
autoscaling:
  enabled: false

# Istio sidecar 리소스 제한
podAnnotations:
  sidecar.istio.io/proxyCPU: "50m"
  sidecar.istio.io/proxyMemory: "64Mi"
  sidecar.istio.io/proxyCPULimit: "100m"
  sidecar.istio.io/proxyMemoryLimit: "128Mi"

# Liveness/Readiness 프로브 완화 (CI 환경에서 느린 시작 허용)
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# 이미지 풀 정책 (캐시 활용)
image:
  pullPolicy: IfNotPresent

# 환경변수 오버라이드 (CI용)
config:
  SPRING_PROFILES_ACTIVE: "ci"
  # JVM 메모리 최적화
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
  # 로깅 레벨 (디버그 최소화)
  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_COM_C4ANG: "INFO"
